name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false   # queue — never run two terraform applies simultaneously

env:
  REGISTRY: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/stocksense

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Enable required APIs
        run: |
          gcloud services enable \
            serviceusage.googleapis.com \
            run.googleapis.com \
            artifactregistry.googleapis.com \
            secretmanager.googleapis.com \
            storage.googleapis.com \
            iam.googleapis.com \
            cloudresourcemanager.googleapis.com \
            compute.googleapis.com \
            monitoring.googleapis.com \
            logging.googleapis.com \
            --project=${{ secrets.GCP_PROJECT_ID }} --quiet

      - name: Create Terraform state bucket
        run: |
          BUCKET="${{ secrets.GCP_PROJECT_ID }}-tf-state"
          if ! gcloud storage buckets describe "gs://$BUCKET" \
               --project=${{ secrets.GCP_PROJECT_ID }} &>/dev/null; then
            gcloud storage buckets create "gs://$BUCKET" \
              --project=${{ secrets.GCP_PROJECT_ID }} \
              --location=europe-west1 \
              --uniform-bucket-level-access
            gcloud storage buckets update "gs://$BUCKET" --versioning
          fi

      - name: Create Artifact Registry repo
        run: |
          if ! gcloud artifacts repositories describe stocksense \
               --location=europe-west1 \
               --project=${{ secrets.GCP_PROJECT_ID }} &>/dev/null; then
            gcloud artifacts repositories create stocksense \
              --repository-format=docker \
              --location=europe-west1 \
              --project=${{ secrets.GCP_PROJECT_ID }}
          fi

      - name: Populate Secret Manager secrets
        run: |
          PROJECT=${{ secrets.GCP_PROJECT_ID }}
          upsert_secret() {
            local name="$1"
            local value="$2"
            if ! gcloud secrets describe "$name" --project="$PROJECT" &>/dev/null; then
              gcloud secrets create "$name" \
                --project="$PROJECT" \
                --replication-policy=automatic
            fi
            echo -n "$value" | gcloud secrets versions add "$name" \
              --data-file=- --project="$PROJECT"
          }
          upsert_secret "jwt-secret-key"           "${{ secrets.JWT_SECRET_KEY }}"
          upsert_secret "stocksense-admin-password" "${{ secrets.STOCKSENSE_ADMIN_PASSWORD }}"

      - name: Empty legacy sqlite-backup bucket so Terraform can delete it
        run: |
          BUCKET="${{ secrets.GCP_PROJECT_ID }}-sqlite-backup"
          if gcloud storage buckets describe "gs://$BUCKET" \
               --project=${{ secrets.GCP_PROJECT_ID }} &>/dev/null; then
            gcloud storage rm --recursive "gs://$BUCKET/**" 2>/dev/null || true
          fi

  push-images:
    runs-on: ubuntu-latest
    needs: bootstrap
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.REGISTRY }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  terraform:
    runs-on: ubuntu-latest
    needs: [bootstrap, push-images]
    env:
      TF_VAR_project_id:     ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_admin_email:    rupak97.4@gmail.com
      TF_VAR_backend_image:  europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/stocksense/backend:${{ github.sha }}
      TF_VAR_frontend_image: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/stocksense/frontend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.GCP_PROJECT_ID }}-tf-state" \
            -backend-config="prefix=terraform/stocksense"
        working-directory: infrastructure/terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: infrastructure/terraform

      - name: Remove orphaned legacy state entries
        working-directory: infrastructure/terraform
        run: |
          # One-time removals for resources from deleted or renamed modules.
          # Each entry is idempotent: fails silently if already gone.
          terraform state rm -lock=false 'module.storage.google_storage_bucket.sqlite_backup'   2>/dev/null || true
          terraform state rm -lock=false 'module.secrets.google_secret_manager_secret.secrets["jwt-secret-key"]'    2>/dev/null || true
          terraform state rm -lock=false 'module.secrets.google_secret_manager_secret.secrets["admin-password"]'    2>/dev/null || true
          terraform state rm -lock=false 'module.secrets.google_secret_manager_secret.secrets["anthropic-api-key"]' 2>/dev/null || true
          terraform state rm -lock=false 'module.iam.google_service_account.deployer'           2>/dev/null || true
          terraform state rm -lock=false 'module.iam.google_project_iam_member.deployer_roles["roles/artifactregistry.admin"]'  2>/dev/null || true
          terraform state rm -lock=false 'module.iam.google_project_iam_member.deployer_roles["roles/iam.serviceAccountUser"]'  2>/dev/null || true
          terraform state rm -lock=false 'module.iam.google_project_iam_member.deployer_roles["roles/run.admin"]'               2>/dev/null || true
          terraform state rm -lock=false 'module.iam.google_project_iam_member.deployer_roles["roles/secretmanager.viewer"]'    2>/dev/null || true
          terraform state rm -lock=false 'module.iam.google_project_iam_member.deployer_roles["roles/storage.admin"]'           2>/dev/null || true
          terraform state rm -lock=false 'module.artifact_registry.google_artifact_registry_repository.images'                  2>/dev/null || true
          terraform state rm -lock=false 'google_project_service.apis["storage-component.googleapis.com"]'                      2>/dev/null || true

      - name: Import existing GCP resources into Terraform state
        working-directory: infrastructure/terraform
        run: |
          PROJECT="${{ secrets.GCP_PROJECT_ID }}"
          REGION="europe-west1"

          # Cloud Run services — import so Terraform updates in-place (image change)
          # rather than destroying + recreating. Fails silently if already in state.
          terraform import -lock=false \
            module.backend_service.google_cloud_run_v2_service.backend \
            "projects/${PROJECT}/locations/${REGION}/services/stocksense-backend" \
            2>/dev/null || true
          terraform import -lock=false \
            module.frontend_service.google_cloud_run_v2_service.frontend \
            "projects/${PROJECT}/locations/${REGION}/services/stocksense-frontend" \
            2>/dev/null || true

          # Storage data bucket — predictable name; will 409 if Terraform tries to recreate
          terraform import -lock=false \
            module.storage.google_storage_bucket.data \
            "${PROJECT}-stocksense-data" 2>/dev/null || true

          # Logging metrics — unique names; create fails 409 if already exists in GCP.
          # Use just the metric name (no project prefix) — matches the ID format the
          # Google provider stores in state after creation.
          terraform import -lock=false \
            module.monitoring.google_logging_metric.api_request_count \
            "stocksense_api_request_count" 2>/dev/null || true
          terraform import -lock=false \
            module.monitoring.google_logging_metric.training_skip \
            "stocksense_training_skip" 2>/dev/null || true

          # Monitoring resources with auto-generated IDs — best-effort import via gcloud.
          # All wrapped in || true: if lookup fails, Terraform recreates them (allowed).
          gcloud components install alpha --quiet 2>/dev/null || true

          NC_NAME=$(gcloud alpha monitoring channels list \
            --project="$PROJECT" \
            --filter='displayName="StockSense Admin Email"' \
            --format='value(name)' --limit=1 2>/dev/null || true)
          [ -n "$NC_NAME" ] && terraform import -lock=false \
            module.monitoring.google_monitoring_notification_channel.email \
            "$NC_NAME" 2>/dev/null || true

          UC_NAME=$(gcloud monitoring uptime-checks list \
            --project="$PROJECT" \
            --filter='displayName="StockSense Backend Health Check"' \
            --format='value(name)' --limit=1 2>/dev/null || true)
          [ -n "$UC_NAME" ] && terraform import -lock=false \
            module.monitoring.google_monitoring_uptime_check_config.backend_health \
            "$UC_NAME" 2>/dev/null || true

          for ENTRY in \
            "StockSense Backend Uptime Failure:uptime_failure" \
            "StockSense High API Error Rate:high_error_rate" \
            "StockSense High API Latency:high_latency" \
            "StockSense Training Skips (possible yfinance rate-limit):training_skip"; do
            DISPLAY="${ENTRY%%:*}"
            TF_KEY="${ENTRY##*:}"
            AP_NAME=$(gcloud alpha monitoring policies list \
              --project="$PROJECT" \
              --filter="displayName=\"$DISPLAY\"" \
              --format='value(name)' --limit=1 2>/dev/null || true)
            [ -n "$AP_NAME" ] && terraform import -lock=false \
              "module.monitoring.google_monitoring_alert_policy.${TF_KEY}" \
              "$AP_NAME" 2>/dev/null || true
          done

          DASH_NAME=$(gcloud monitoring dashboards list \
            --project="$PROJECT" \
            --filter='displayName="StockSense India — Production"' \
            --format='value(name)' --limit=1 2>/dev/null || true)
          [ -n "$DASH_NAME" ] && terraform import -lock=false \
            module.monitoring.google_monitoring_dashboard.main \
            "$DASH_NAME" 2>/dev/null || true

      - name: Pre-apply safety net — delete un-importable logging metrics
        working-directory: infrastructure/terraform
        run: |
          PROJECT="${{ secrets.GCP_PROJECT_ID }}"
          # If a logging metric exists in GCP but wasn't imported into state (import
          # can silently fail), Apply would try to CREATE it and get 409 AlreadyExists.
          # Deleting the filter definition is safe — no historical data is stored in
          # logging metric descriptors; data lives in Cloud Logging, not the metric.
          for PAIR in \
            "stocksense_api_request_count:module.monitoring.google_logging_metric.api_request_count" \
            "stocksense_training_skip:module.monitoring.google_logging_metric.training_skip"; do
            METRIC="${PAIR%%:*}"
            TF_RESOURCE="${PAIR##*:}"
            if terraform state show "$TF_RESOURCE" &>/dev/null; then
              echo "$METRIC is in Terraform state — no action needed"
            else
              echo "$METRIC NOT in state — deleting from GCP so Terraform can recreate it"
              gcloud logging metrics delete "$METRIC" \
                --project="$PROJECT" --quiet 2>/dev/null || true
            fi
          done

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve -lock=false \
            -target=google_project_service.apis \
            -target=google_project_iam_member.deployer_sa_user \
            -target=google_project_iam_member.compute_sa_secret_accessor \
            -target=google_project_iam_member.compute_sa_storage_admin \
            -target=time_sleep.iam_propagation \
            -target=module.storage \
            -target=module.backend_service \
            -target=module.frontend_service \
            -target=module.monitoring
        working-directory: infrastructure/terraform

      - name: Read deployment URLs
        id: urls
        run: |
          echo "frontend=$(terraform output -raw frontend_url)" >> $GITHUB_OUTPUT
          echo "backend=$(terraform output -raw backend_url)"  >> $GITHUB_OUTPUT
        working-directory: infrastructure/terraform

      - name: Terraform Apply — wire CORS to real frontend URL
        run: |
          terraform apply -auto-approve -lock=false \
            -target=module.backend_service \
            -var 'cors_origins=["${{ steps.urls.outputs.frontend }}"]'
        working-directory: infrastructure/terraform

      - name: Deployment summary
        run: |
          echo "### Deployment complete" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ steps.urls.outputs.frontend }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend  | ${{ steps.urls.outputs.backend }} |"  >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "Frontend: ${{ steps.urls.outputs.frontend }}"
          echo "Backend:  ${{ steps.urls.outputs.backend }}"
