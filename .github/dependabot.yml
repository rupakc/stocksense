version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    labels: ["dependencies", "python"]
    open-pull-requests-limit: 5
    groups:
      non-breaking:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    labels: ["dependencies", "javascript"]
    open-pull-requests-limit: 5
    groups:
      non-breaking:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies", "github-actions"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    labels: ["dependencies", "docker"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
    labels: ["dependencies", "docker"]
