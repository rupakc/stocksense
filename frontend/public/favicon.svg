<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background with rounded corners -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>

  <!-- Grid lines (subtle) -->
  <line x1="4" y1="22" x2="28" y2="22" stroke="#1e293b" stroke-width="1"/>
  <line x1="4" y1="15" x2="28" y2="15" stroke="#1e293b" stroke-width="1"/>

  <!-- Upward trending chart line -->
  <polyline
    points="4,24 9,20 14,21 18,13 23,9 28,5"
    fill="none"
    stroke="#22c55e"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Highlight dot at peak -->
  <circle cx="28" cy="5" r="2.2" fill="#22c55e"/>

  <!-- Bottom bar (axis) -->
  <line x1="4" y1="27" x2="28" y2="27" stroke="#334155" stroke-width="1.2" stroke-linecap="round"/>
</svg>
