[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stocksense-backend"
version = "0.1.0"
description = "Indian Stock Market Monitoring and Prediction Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.111.0",
    "uvicorn[standard]~=0.30.0",
    "sqlalchemy~=2.0.0",
    "alembic~=1.13.0",
    "pydantic~=2.7.0",
    "pydantic-settings>=2.3,<2.15",
    "yfinance~=0.2.40",
    "pandas~=2.2.0",
    "numpy~=1.26.0",
    "prophet~=1.1.5",
    "scikit-learn~=1.5.0",
    "vaderSentiment~=3.3.2",
    "feedparser~=6.0.11",
    "beautifulsoup4~=4.12.0",
    "requests~=2.32.0",
    "httpx~=0.27.0",
    "celery~=5.4.0",
    "redis~=5.0.0",
    "ta~=0.11.0",
    "joblib~=1.4.0",
    "aiofiles~=23.2.0",
    "aiosqlite~=0.20.0",
    "python-multipart~=0.0.9",
    "google-cloud-storage~=2.17.0",
    "bcrypt~=4.0.0",
    "python-jose[cryptography]~=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.2.0",
    "pytest-asyncio~=0.23.0",
    "httpx~=0.27.0",
    "ruff~=0.4.0",
    "bandit~=1.8.0",
    "pip-audit~=2.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.bandit]
targets = ["app"]
exclude_dirs = ["tests", ".venv"]
